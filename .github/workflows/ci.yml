# Every push to main and every pull request: build, prove the committed dist/
# is what the source builds, typecheck, test. Then, on a push to main only, tag
# the release: when package.json's version is newer than every vX.Y.Z tag and
# CHANGELOG.md has its "## X.Y.Z" entry, the annotated tag vX.Y.Z is created on
# the pushed commit (Jalez/kehikko-desktop/.github/actions/tag-on-merge).
# Consumers install a tag (`#vX.Y.Z`), so the tag is the release. Nobody tags by
# hand.
#
# dist/ is committed because consumers install this package straight from git
# and cannot build it themselves (PACKAGING.md). A dist/ that has drifted from
# src/ ships last week's contract without an error anywhere, so this is the
# check that matters most here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels an older pull request run, never a run on main: that
# one may be about to tag a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: The committed dist/ matches the source
        run: |
          git diff --exit-code dist
          # and nothing new or left over: an untracked file is a build nobody committed
          test -z "$(git status --porcelain dist)" || { git status --porcelain dist; exit 1; }

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  tag:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: protocol-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: Jalez/kehikko-desktop/.github/actions/tag-on-merge@main
        with:
          changelog: CHANGELOG.md
